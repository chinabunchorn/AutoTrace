name: Deploy pitch to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/pitch/**'
      - 'frontend/demo-a/**'
      - 'frontend/assets/fonts.css'
      - 'frontend/assets/font-*.woff2'
      - 'frontend/assets/favicon.svg'
      - 'frontend/assets/licenses/DM-Sans-OFL.txt'
      - 'frontend/assets/licenses/IBM-Plex-Sans-Thai-OFL.txt'
      - 'scripts/build_pitch_pages.py'
      - 'tests/test_pitch_pages.py'
      - '.github/workflows/deploy-pitch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-pitch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test presentation packaging
        run: python3 -m unittest discover -s tests -p test_pitch_pages.py -v
      - name: Assemble presentation-only site
        run: python3 scripts/build_pitch_pages.py --out outputs/pages-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: outputs/pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
