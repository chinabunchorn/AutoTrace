<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <title>Illustrative Earth horizon</title>
  <desc>Authored decorative curvature, clouds and graticule. Not satellite imagery, surveyed geography or an orbital track.</desc>
  <defs>
    <linearGradient id="space" x2="0" y2="1">
      <stop stop-color="#203b39"/><stop offset=".5" stop-color="#4c6b62"/><stop offset="1" stop-color="#a5bda9"/>
    </linearGradient>
    <radialGradient id="ocean" cx=".55" cy=".13" r=".85">
      <stop stop-color="#b6cfc1"/><stop offset=".45" stop-color="#9bbbab"/><stop offset="1" stop-color="#729585"/>
    </radialGradient>
    <clipPath id="planet"><ellipse cx="880" cy="1170" rx="1300" ry="1000"/></clipPath>
    <filter id="atmosphere" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="cloud-soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#space)"/>
  <g fill="#eff2e2" opacity=".35">
    <circle cx="110" cy="70" r="1.4"/><circle cx="340" cy="122" r="1"/><circle cx="530" cy="52" r="1.4"/>
    <circle cx="720" cy="94" r="1"/><circle cx="900" cy="40" r="1.5"/><circle cx="1070" cy="98" r="1"/>
    <circle cx="1250" cy="46" r="1.3"/><circle cx="1490" cy="92" r="1.4"/><circle cx="80" cy="235" r="1"/>
    <circle cx="1540" cy="260" r="1.2"/><circle cx="195" cy="158" r="1.2"/><circle cx="1140" cy="158" r="1"/>
  </g>
  <path d="M80 275Q760-50 1550 220" fill="none" stroke="#e2e9d8" stroke-width="1.2" stroke-dasharray="5 13" opacity=".2"/>
  <ellipse cx="880" cy="1170" rx="1300" ry="1000" fill="none" stroke="#d3e8d5" stroke-width="24" opacity=".38" filter="url(#atmosphere)"/>
  <ellipse cx="880" cy="1170" rx="1300" ry="1000" fill="url(#ocean)" stroke="#dae9d8" stroke-width="2"/>
  <g clip-path="url(#planet)">
    <g fill="none" stroke="#edf3df" stroke-width="1" opacity=".19">
      <ellipse cx="880" cy="1170" rx="1280" ry="850"/>
      <ellipse cx="880" cy="1170" rx="1210" ry="620"/>
      <ellipse cx="880" cy="1170" rx="1070" ry="380"/>
      <path d="M880 170C420 280 245 620 250 1040M880 170C660 290 590 660 620 1080M880 170C1050 290 1170 660 1190 1080M880 170C1280 310 1500 660 1530 1080"/>
    </g>
    <g fill="none" stroke="#eff3e1" stroke-linecap="round" filter="url(#cloud-soft)" opacity=".35">
      <path d="M30 465C130 420 225 449 330 430M90 491C170 473 257 490 370 457" stroke-width="18"/>
      <path d="M1230 490C1330 446 1440 461 1575 404M1280 521C1370 499 1460 520 1610 459" stroke-width="20"/>
      <path d="M80 670C175 655 260 680 325 650M1190 675C1320 680 1435 615 1520 641" stroke-width="12"/>
    </g>
  </g>

</svg>
